# Coverage gates for inithooks, one per language (docs/ci-cd.md):
#   tests / coverage   shell: tests/coverage.sh under kcov, 98 percent, the
#                      number measured on master (lowest file lib/init-fence.sh
#                      63 of 64 lines, COVERAGE.md "measured baseline")
#   python / coverage  pytest under coverage.py over libinithooks and bin,
#                      95 percent, the bar for project-authored code; the
#                      inherited modules without tests are omitted in
#                      pyproject.toml until their tests land
# Both are required checks on master. Thresholds are only ever raised.
name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 98
  python:
    uses: keel-linux/.github/.github/workflows/test-python.yml@main
    with:
      threshold: 95
      package: libinithooks,bin
      tests: tests
